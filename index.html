<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Quiz with Proctoring</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .quiz-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        /* Camera Feed Style */
        #camera-container {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 150px;
            height: 110px;
            border: 3px solid #dc3545;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .text-danger { color: #dc3545; }
        .text-primary { color: #007bff; }
        
        .question { margin-bottom: 15px; }
        button {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background: #218838; }
    </style>
</head>
<body>

    <!-- Camera Feed -->
    <div id="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <div class="quiz-container" id="main-content">
        <h2>Security Quiz</h2>
        
        <div class="status-bar">
            <div class="text-primary">Time Left: <span id="time-left">60</span>s</div>
            <div class="text-danger">Strikes: <span id="strike-count">0</span> / 3</div>
        </div>

        <div id="quiz-area">
            <div class="question">
                <p>1. What is the capital of Pakistan?</p>
                <input type="radio" name="q1" value="Lahore"> Lahore<br>
                <input type="radio" name="q1" value="Islamabad"> Islamabad<br>
                <input type="radio" name="q1" value="Karachi"> Karachi<br>
            </div>
            <button onclick="submitQuiz()">Submit Quiz</button>
        </div>
    </div>

    <script>
        // Configuration Variables
        let timeRemaining = 60; // 60 seconds timer
        let strikes = 0;
        const maxStrikes = 3;
        let isQuizActive = true;
        let timerInterval;

        // 1. Camera Initialization
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('webcam').srcObject = stream;
            } catch (error) {
                alert("Camera access is strictly required to start this quiz!");
                endQuiz("Disqualified: Camera access denied.");
            }
        }

        // 2. Timer Logic
        function startTimer() {
            timerInterval = setInterval(() => {
                if (!isQuizActive) return;
                
                timeRemaining--;
                document.getElementById('time-left').innerText = timeRemaining;

                if (timeRemaining <= 0) {
                    endQuiz("Time is up! Your quiz has been auto-submitted.");
                }
            }, 1000);
        }

        // 3. Tab Switching & Security Detection
        document.addEventListener("visibilitychange", () => {
            // Agar quiz active hai aur user dusri tab mein gaya
            if (document.hidden && isQuizActive) {
                strikes++;
                document.getElementById('strike-count').innerText = strikes;
                
                if (strikes >= maxStrikes) {
                    endQuiz("Disqualified! You exceeded the maximum allowed tab switches (3 Strikes).");
                } else {
                    alert(`WARNING! Do not switch tabs or minimize the window.\nStrike: ${strikes} out of ${maxStrikes}`);
                }
            }
        });

        // End Quiz Function
        function endQuiz(message) {
            isQuizActive = false;
            clearInterval(timerInterval);
            
            // Stop Camera
            const videoElement = document.getElementById('webcam');
            const stream = videoElement.srcObject;
            if (stream) {
                const tracks = stream.getTracks();
                tracks.forEach(track => track.stop());
            }

            // Show result
            document.getElementById('quiz-area').innerHTML = `<h3 class="text-danger">${message}</h3>`;
        }

        // Manual Submit
        function submitQuiz() {
            if (isQuizActive) {
                endQuiz("Quiz submitted successfully!");
            }
        }

        // Start everything when page loads
        window.onload = () => {
            startCamera();
            startTimer();
        };
    </script>
</body>
</html>
