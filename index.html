<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .header { text-align: center; background: #2c3e50; color: white; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        #ai-status { background: #f39c12; color: white; padding: 5px 15px; border-radius: 5px; font-size: 14px; font-weight: bold; }
        .report-card { display: none; background: #fff; padding: 20px; margin-bottom: 20px; border-radius: 8px; border-top: 5px solid #3498db; }
        .report-card h2 { margin-top: 0; color: #2c3e50; text-align: center; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .report-card p { font-size: 17px; margin: 8px 0; }
        .log-box { background: #fdf2e9; padding: 10px; border-left: 4px solid #e74c3c; margin-top: 15px; font-size: 14px; }
        .log-box ul { margin: 5px 0; padding-left: 20px; color: #c0392b; font-weight: bold; }
        .question h3 { color: #000000; font-weight: 900; font-size: 18px; }
        .options label { display: block; margin: 10px 0; cursor: pointer; color: #000000; font-weight: bold; font-size: 16px; }
        .question { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #ddd; }
        #timer { font-size: 20px; font-weight: bold; color: #e74c3c; background: white; padding: 5px 15px; border-radius: 5px; }
        .btn-submit { background: #27ae60; color: white; border: none; padding: 12px 20px; font-size: 18px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 20px; font-weight: bold; }
        .btn-submit:hover { background: #2ecc71; }
        .explanation { display: none; padding: 10px; margin-top: 10px; border-left: 4px solid; font-size: 15px; border-radius: 4px; color: #333; }
        #warnings { color: red; font-weight: bold; text-align: center; margin-top: 10px; font-size: 16px; }
        #video-container { position: fixed; bottom: 10px; right: 10px; width: 220px; height: 165px; background: black; border: 4px solid #e74c3c; border-radius: 8px; overflow: hidden; box-shadow: 0px 4px 15px rgba(0,0,0,0.5); z-index: 1000; }
        #webcam, #ai-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #ai-canvas { z-index: 1001; }
    </style>
</head>
<body>

    <script>

        const quizData = [

    { q: "38. Matplotlib mein subplots (grids) banane ke liye kya use hota hai?", options: ["plt.multiplot", "plt.subplots", "plt.grid", "plt.figure"], ans: 1, exp: "plt.subplots() se rows aur columns define kar ke multiple plots banaye jate hain." },
    { q: "39. Outliers ko detect karne ke liye konsa visual tool sab se behtar hai?", options: ["Line chart", "Boxplot", "Pie chart", "Bar chart"], ans: 1, exp: "Boxplot data ke quartiles aur extreme outliers ko wazeh karta hai." },
    { q: "40. 'Business Storytelling with Data' ka asal maqsad kya hai?", options: ["Zyada colors use karna", "Actionable insights aasaan zaban mein dena", "Sirf math dikhana", "3D charts banana"], ans: 1, exp: "Data se aisi narrative banana jo non-technical logon ko decision lene mein madad de." },

    // --- Week 5: SQL & Database Fundamentals ---
    { q: "41. SQL ka full form kya hai?", options: ["Simple Query Language", "Structured Query Language", "Standard Question Language", "Sequential Query Language"], ans: 1, exp: "SQL relational databases ko manage karne ki zaban hai." },

    // --- Week 6: Machine Learning Fundamentals ---
    { q: "51. Agar hamare paas output label (target) majood ho, toh yeh konsi learning hai?", options: ["Unsupervised Learning", "Supervised Learning", "Reinforcement Learning", "Semi-supervised"], ans: 1, exp: "Supervised learning mein model labeled data par train hota hai." },
    { q: "52. Ghar ki qeemat (continuous value) predict karna konsi problem hai?", options: ["Classification", "Clustering", "Regression", "Dimensionality Reduction"], ans: 2, exp: "Continuous numbers predict karna Regression kahlata hai." },
    { q: "53. Email Spam ya Not Spam predict karna konsi problem hai?", options: ["Classification", "Regression", "Clustering", "Association"], ans: 0, exp: "Categories (Spam/Not Spam) predict karna Classification hai." },
    { q: "54. ML model ko evaluate karne ke liye data ko kis tarah divide kiya jata hai?", options: ["100% Training", "Train/Test split", "Sirf Test", "Delete kar ke naya data lana"], ans: 1, exp: "Model ko Train set par sikhaya jata hai aur Test set par evaluate kiya jata hai." },
    { q: "55. Overfitting kab hoti hai?", options: ["Jab model training aur test dono par bura ho", "Jab model training data rat le aur naye data par fail ho jaye", "Jab model bilkul train na ho", "Jab data bohat kam ho"], ans: 1, exp: "Overfitting ka matlab hai model ne noise bhi yaad kar liya hai aur generalize nahi kar paa raha." },
    { q: "56. In mein se konsa Classification metric nahi hai?", options: ["Accuracy", "F1-Score", "Mean Squared Error (MSE)", "Precision"], ans: 2, exp: "MSE regression models ki metric hai." },
    { q: "57. Scikit-learn mein model train karne ke liye konsa method call kiya jata hai?", options: ["model.train()", "model.fit()", "model.predict()", "model.evaluate()"], ans: 1, exp: "fit(X, y) method scikit-learn mein standard training function hai." },
    { q: "58. K-Means konsi Machine Learning ka algorithm hai?", options: ["Supervised Regression", "Supervised Classification", "Unsupervised Clustering", "Reinforcement"], ans: 2, exp: "K-Means unlabeled data ki grouping (clustering) karta hai." },
    { q: "59. Model unseen (test) data par kesa perform karega, usay predict karne ke liye kya use karte hain?", options: ["model.fit()", "model.train()", "model.predict()", "model.score()"], ans: 2, exp: "predict() method naye data par predictions generate karta hai." },
    { q: "60. Confusion Matrix kis cheez ki performance dekhne ke liye banaya jata hai?", options: ["Regression Models", "Clustering Algorithms", "Classification Models", "Data Preprocessing"], ans: 2, exp: "Yeh True Positives, False Positives waghera dikhata hai classification ke liye." }
];

        const quizContainer = document.getElementById('quiz-container');
        let isSubmitted = false; 
        let warningCount = 0;
        let lastWarningTime = 0;
        let warningLogs = []; 
        let submissionType = "Manual (Student Submitted)";

        function loadQuiz() {
            quizData.forEach((item, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.classList.add('question');
                questionDiv.innerHTML = `<h3>${item.q}</h3><div class="options">${item.options.map((opt, i) => `<label><input type="radio" name="q${index}" value="${i}"> ${opt}</label>`).join('')}</div><div class="explanation" id="exp-${index}"><strong>Answer:</strong> ${item.options[item.ans]} <br><br><strong>Explanation:</strong> ${item.exp}</div>`;
                quizContainer.appendChild(questionDiv);
            });
            const submitBtn = document.createElement('button');
            submitBtn.innerText = "Submit Exam"; submitBtn.id = "submit-btn";
            submitBtn.classList.add('btn-submit'); 
            submitBtn.onclick = () => submitQuiz("Manual (Student clicked Submit)");
            quizContainer.appendChild(submitBtn);
        }

        function submitQuiz(typeOfSubmission) {
            if (isSubmitted) return;
            isSubmitted = true;
            submissionType = typeOfSubmission; 
            
            clearInterval(timerInterval); 
            if(aiInterval) clearInterval(aiInterval);

            let score = 0, wrong = 0, unattempted = 0, total = quizData.length;

            quizData.forEach((item, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                const expDiv = document.getElementById(`exp-${index}`);
                expDiv.style.display = "block"; 

                if (!selected) { unattempted++; expDiv.style.borderLeftColor = "#f39c12"; expDiv.style.backgroundColor = "#fdf2e9"; } 
                else if (parseInt(selected.value) === item.ans) { score++; expDiv.style.borderLeftColor = "#1abc9c"; expDiv.style.backgroundColor = "#e8f8f5"; } 
                else { wrong++; expDiv.style.borderLeftColor = "#e74c3c"; expDiv.style.backgroundColor = "#fdedec"; }
                
                document.querySelectorAll(`input[name="q${index}"]`).forEach(opt => opt.disabled = true);
            });

            document.getElementById('submit-btn').style.display = "none";
            let percentage = ((score / total) * 100).toFixed(2);
            let status = percentage >= 50 ? "<span style='color:#27ae60;'><b>PASSED</b></span>" : "<span style='color:#c0392b;'><b>FAILED</b></span>";
            
            let logHTML = warningLogs.length > 0 ? `<ul>${warningLogs.map(log => `<li>${log}</li>`).join('')}</ul>` : `<span style="color:#27ae60; font-weight:bold;">No cheating detected. Excellent!</span>`;

            const reportDiv = document.getElementById('result-report');
            reportDiv.style.display = "block";
            reportDiv.innerHTML = `<h2>📊 Detailed Final Report</h2><div style="display:flex; justify-content:space-between; flex-wrap:wrap;"><div style="flex:1; min-width: 250px;"><p><strong>Total Questions:</strong> ${total}</p><p style="color: #27ae60;"><strong>✅ Correct:</strong> ${score}</p><p style="color: #e74c3c;"><strong>❌ Wrong:</strong> ${wrong}</p><p style="color: #f39c12;"><strong>⚠️ Unattempted:</strong> ${unattempted}</p></div><div style="flex:1; min-width: 250px; text-align:right;"><p><strong>Score:</strong> ${percentage}%</p><p><strong>Result:</strong> ${status}</p><p><strong>Submitted By:</strong> <u>${submissionType}</u></p></div></div><div class="log-box"><strong>⚠️ Security Strikes:</strong><br>${logHTML}</div>`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            const canvas = document.getElementById('ai-canvas');
            canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
        }

        let mediaStream = null; let aiModel = null; let aiInterval;

        function triggerWarning(reason) {
            if (isSubmitted) return;
            let now = Date.now();
            if (now - lastWarningTime < 4000) return; 
            lastWarningTime = now;
            warningCount++;
            let timestamp = new Date().toLocaleTimeString();
            warningLogs.push(`[${timestamp}] Strike ${warningCount}: ${reason}`);
            document.getElementById('warnings').innerText = `Warnings: ${warningCount} / 3 (Auto-submit after 3 strikes)`;
            if (warningCount >= 3) { alert(`🚨 Maximum strikes reached! Reason: ${reason}. Exam is Auto-Submitting.`); submitQuiz("System Auto-Submit (Cheating Limit Reached)"); } 
            else { alert(`WARNING ${warningCount}: ${reason}`); }
        }

        async function startSecurityFeatures() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                const videoElement = document.getElementById('webcam');
                videoElement.srcObject = mediaStream;
                aiModel = await cocoSsd.load();
                document.getElementById('ai-status').innerText = "🟢 Visual AI Active";
                document.getElementById('ai-status').style.background = "#27ae60";

                const canvas = document.getElementById('ai-canvas');
                const ctx = canvas.getContext('2d');

                aiInterval = setInterval(async () => {
                    if (isSubmitted || videoElement.readyState !== 4) return;
                    canvas.width = videoElement.videoWidth; canvas.height = videoElement.videoHeight;
                    const predictions = await aiModel.detect(videoElement);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    let persons = 0; let phoneDetected = false;
                    predictions.forEach(pred => {
                        ctx.beginPath(); ctx.rect(...pred.bbox); ctx.lineWidth = 4;
                        if (pred.class === 'cell phone') { ctx.strokeStyle = '#e74c3c'; ctx.fillStyle = '#e74c3c'; phoneDetected = true; } 
                        else if (pred.class === 'person') { ctx.strokeStyle = '#2ecc71'; ctx.fillStyle = '#2ecc71'; persons++; }
                        ctx.stroke(); ctx.font = 'bold 16px Arial';
                        ctx.fillText(`${pred.class}`, pred.bbox[0], pred.bbox[1] > 20 ? pred.bbox[1] - 5 : 20);
                    });

                    if (phoneDetected) { triggerWarning("Mobile Phone detected by AI in camera view."); } 
                    else if (persons > 1) { triggerWarning("Multiple persons detected in camera frame."); } 
                    else if (persons === 0) { triggerWarning("Candidate missing from the camera frame."); }
                }, 1000); 
            } catch (err) { console.log("Camera access denied."); }
        }

        document.addEventListener("visibilitychange", () => { if (document.hidden) triggerWarning("Candidate switched the browser tab."); });
        window.addEventListener("blur", () => { triggerWarning("Focus Lost: Candidate looked away or clicked on another screen."); });

        let timeLeft = 60 * 60; let timerInterval;
        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) { clearInterval(timerInterval); alert("⏰ Time is up!"); submitQuiz("System Auto-Submit (Time Limit)"); }
                timeLeft--; let m = Math.floor(timeLeft / 60); let s = timeLeft % 60;
                document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            }, 1000);
        }

        setTimeout(() => { loadQuiz(); startTimer(); startSecurityFeatures(); }, 500);
    </script>
</body>
</html>
